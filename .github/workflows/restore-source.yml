name: Restore missing source files
on:
  push:
    paths:
      - '.github/workflows/restore-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing project source from archived release
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          archive = Path('fixed_bot_v2.zip')
          if not archive.exists():
              raise SystemExit('Archive not found')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  parts = PurePosixPath(item.filename).parts
                  if item.is_dir() or not parts or '..' in parts:
                      continue
                  if any(p in ('__pycache__', '.git') for p in parts):
                      continue
                  if parts[-1] == '.env' or item.filename.endswith(('.pyc', '.db', '.db-wal', '.db-shm', '.log', '.zip')):
                      continue
                  target = Path(*parts)
                  if target.exists():
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Commit added files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Restore missing bot and frontend source files'
            git push
          fi
